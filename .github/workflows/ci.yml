name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Compact compiler
        run: |
          curl -fsSL https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-installer.sh -o /tmp/compact-installer.sh
          bash /tmp/compact-installer.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download Compact toolchain
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Pin to 0.31.1 — this is the toolchain version whose generated JS
          # targets compact-runtime 0.16.0, matching the SDK version pinned
          # in package.json (@midnight-ntwrk/midnight-js-protocol 4.1.1).
          # `compact update` with no version installs the newest toolchain,
          # which can drift ahead of the JS SDK and target a runtime version
          # the SDK doesn't ship yet — causing a CompactError version
          # mismatch at test/build time. Bump this in lockstep with the SDK
          # dependency versions in package.json, not independently.
          compact update 0.31.1

      - name: Verify Compact version
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact --version

      - name: Compile allowlist contract
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact compile contracts/allowlist.compact managed/allowlist

      - name: Compile age-gate contract
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact compile contracts/age-gate.compact managed/age-gate

      - name: Compile counter contract
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact compile contracts/counter.compact managed/counter

      - name: Run test suite
        run: node --experimental-vm-modules node_modules/.bin/jest --testPathPattern=tests/ --forceExit

      - name: Build frontend
        run: npm run build
